# FlyLab compound library - schema v3 (see docs/DESIGN_v0.5.md and
# flylab/pharm/evidence.py).
#
# GENERATED-BY-HAND-THEN-CHECKED: every row carries a `source` string, an
# `evidence_tier`, the KIND of parameter the source reported (`param_type`) and
# how far that source sits from "this compound, this receptor, this species"
# (`relation`).  Nothing here is fitted to animal data.
#
# Schema v3 exists because of two peer-review objections (v0.5 -> v0.6):
#
#   "EC50 is a functional potency parameter, not a receptor binding constant.
#    IC50 values are also used for some compounds.  A Hill response derived
#    from EC50 describes normalized functional response, not physical receptor
#    occupancy."
#
#   "Missing receptor values are represented by ec50_M = 0.01 even when
#    direction: none, so the model reports things like diazepam/RDL = 10^-4.
#    Missing evidence should not become a small quantitative response."
#
# So: `ec50_M` is gone as a stored field (`value_M` + `param_type` replace it),
# and placeholder rows carry NO number at all - they report N/A and are
# excluded from every numeric aggregation.
schema_version: 3
library_version: '0.6'
notes:
  schema_v3: 'Schema v3 answers two peer-review objections. (1) ''EC50 is a functional potency parameter, not a receptor binding constant. A Hill response derived from EC50 describes normalized functional response, not physical receptor occupancy.'' Every row therefore records param_type (Kd | Ki | EC50 | IC50 | Kb | relative_potency | class_order | unknown) and relation, and flylab/pharm/evidence.py decides from those two facts alone whether the row may drive binding_occupancy, binding_engagement_proxy, functional_engagement or nothing at all. v0.6.1 closes a hole a reviewer found in that rule: param_type alone used to be enough for binding_occupancy, so a Kd measured in an aphid produced a model the paper described as physical receptor occupancy of a Drosophila receptor. The relation is now also graded as an ordered evidence distance (E0 exact compound+receptor+species, E1 other species, E2 related receptor, E3 class extrapolation, E4 unsupported) and the permitted transformation is a function of (param_type, evidence_distance): Kd/Ki at E0 -> binding_occupancy; Kd/Ki at E1 or E2 -> binding_engagement_proxy; Kd/Ki at E3 -> functional_engagement_proxy; EC50/IC50/Kb at E0 -> functional_engagement; EC50/IC50/Kb at E1-E3 -> functional_engagement_proxy; anything at E4 -> not_modelled. A proxy computes the same Hill expression but says it is a proxy and carries a provenance warning naming what was transferred (the species, the preparation or the chemical class). Every row reports evidence_distance beside relation, and flylab.pharm.occupancy.evidence_distance_table() is the census by distance. (2) ''Missing receptor values are represented by ec50_M = 0.01 even when direction: none, so the model reports things like diazepam/RDL = 10^-4. Missing evidence should not become a small quantitative response.'' Placeholder rows therefore carry value_M: null and param_type: unknown, report engagement N/A, and are excluded from every numeric aggregation.'
  value_M: value_M is the sourced parameter in molar, whose KIND is given by param_type. It replaces the v2 field ec50_M, which was a lie for the IC50 and Kd rows. load_library() still mirrors value_M onto a deprecated ec50_M key for old callers; that alias may hold an IC50 or a Kd and must not be read as an EC50.
  param_types:
    Kd: equilibrium dissociation constant from a binding assay; the only kind of value (with Ki) from which FlyLab will report physical fractional occupancy - and only at evidence distance E0 (relation exact_compound_exact_receptor_exact_species). A Kd at E1/E2 drives binding_engagement_proxy instead, and at E3 only functional_engagement_proxy.
    Ki: inhibition constant from a competition binding assay; same rule as Kd.
    EC50: half-maximal effective concentration of a FUNCTIONAL response. The Hill curve built from it is a normalised functional engagement, not an occupancy.
    IC50: half-maximal inhibitory concentration (functional block or radioligand displacement); assay-condition dependent.
    Kb: antagonist dissociation constant from a Schild/Gaddum analysis.
    relative_potency: a fold-difference with no concentration scale; not modellable.
    class_order: a statement about a chemical class, not a measurement here; not modellable.
    unknown: no usable number exists; the row is a placeholder and reports N/A.
  evidence_distance: 'The relation vocabulary below is graded onto an ordered evidence distance, reported on every row as evidence_distance: E0 exact_compound_exact_receptor_exact_species (on-target, nothing transferred); E1 exact_compound_exact_receptor_other_species (cross-species); E2 exact_compound_related_receptor (hybrid/chimeric/native-mixed/orthologous preparation); E3 class_extrapolation; E4 unsupported. Distance never strengthens a claim, only weakens it. See flylab/pharm/evidence.py TRANSFORMATION_TABLE for the full (param_type, distance) -> engagement_model rule.'
  relations:
    exact_compound_exact_receptor_exact_species: 'this compound, this receptor, Drosophila (evidence distance E0). The ONLY relation under which a Kd/Ki may drive binding_occupancy, and the only one under which a potency is reported as functional_engagement rather than functional_engagement_proxy.'
    exact_compound_exact_receptor_other_species: 'this compound and receptor, other species (E1). A Kd/Ki here is demoted to binding_engagement_proxy and a potency to functional_engagement_proxy; both carry a provenance warning naming the species gap.'
    exact_compound_related_receptor: 'hybrid, chimeric, native-mixed or orthologous preparation that is not exactly this key (E2). A Kd/Ki here is demoted to binding_engagement_proxy and a potency to functional_engagement_proxy, with a warning naming the preparation.'
    class_extrapolation: 'order-of-magnitude class statement or a contrast derived from a different receptor (E3); every row here is a functional_engagement_proxy at best, whatever its parameter type.'
    unsupported: 'no source supports any value at this receptor (E4); placeholder rows, never modelled.'
  species: species names the preparation the number came from. Rows without it are Drosophila melanogaster; placeholder rows have none.
  evidence_tiers:
    literature_order: Order of magnitude taken from a named publication for this compound (or, where stated in the source string, an explicit order-of-magnitude contrast derived from a named publication on a related preparation). Not a refit, not a measured constant for this exact receptor/species unless relation says so.
    class_placeholder: 'No usable number exists for this compound at this receptor. The row carries value_M: null, param_type: unknown, direction: none and relation: unsupported. It reports engagement N/A and is excluded from every numeric aggregation. It is NOT a small number: schema v2''s ec50_M 0.01 placeholder is gone.'
    measured_fit: Reserved. Only for values fitted to data imported by the user. Nothing in the shipped library uses this tier.
  hill_n: Hill coefficients are teaching defaults in the 1.0-1.5 range unless the source reports steeper cooperativity.
  efficacy: Optional relative efficacy (0..1), used as the tau-like term of the operational model in flylab.pharm.binding. Absent means 'assume full'.
  nicotinic_subunits: 'insect_nAChR is a documented AGGREGATE key and still drives the g_ach gain rules. insect_nAChR_alpha6 and insect_nAChR_beta1 carry the subunit-resolved rows: spinosad''s value sits on alpha6 (Perry 2015) and imidacloprid''s aphid binding Kd sits on beta1 (Bass 2011, R81T; cross-species/E1, so it reports binding_engagement_proxy). A third nicotinic key, insect_nAChR_native_dmel, is preparation-resolved rather than subunit-resolved and holds the one Drosophila-measured binding constant in the library (Tomizawa 1996). Neonicotinoid electrophysiology is nearly all done on hybrid Dalpha/chicken-beta2 or native mixed preparations, which is why those rows stay on the aggregate key and say so in relation/source. No number was invented for the split.'
  v04_continuity: imidacloprid, nitenpyram, nicotine, diazepam and fipronil keep the exact value_M / n / direction shipped in v0.4 and v0.5; schema v3 only adds the type of each value, its relation and its species. Tests depend on those numbers.
receptors:
  insect_nAChR:
    organism: insect
    transmitter: acetylcholine
    family: pLGIC-cation
    note: 'AGGREGATE KEY: Drosophila Dalpha/Dbeta nicotinic receptors lumped together (Dalpha1-Dalpha7, Dbeta1-3). The gain rules in flylab/pharm/mechanisms.py still read this key, so it is kept, but Croset et al. 2018 show alpha1/alpha5/alpha6/alpha7 and beta1 dominate different, only partly overlapping cell sets: spinosad acts at alpha6 while the neonicotinoids/sulfoximines are beta1-dependent. Any selectivity claim made on this key is capped by that. Subunit-resolved rows live in insect_nAChR_alpha6 / insect_nAChR_beta1.'
    aggregate: true
    subunit_resolved_keys:
    - insect_nAChR_alpha6
    - insect_nAChR_beta1
  insect_nAChR_alpha6:
    organism: insect
    transmitter: acetylcholine
    family: pLGIC-cation
    note: 'Drosophila Dalpha6 nicotinic subunit: the spinosyn target. Subunit-resolved key added in schema v3; a compound appears here only when its source measured an alpha6-containing receptor.'
  insect_nAChR_beta1:
    organism: insect
    transmitter: acetylcholine
    family: pLGIC-cation
    note: 'Insect nAChR beta1 subunit (Drosophila Dbeta1 / aphid Mpbeta1): the subunit whose R81T substitution abolishes high-affinity neonicotinoid binding. Subunit-resolved key added in schema v3; a compound appears here only when its source measured a beta1-containing receptor.'
  insect_nAChR_native_dmel:
    organism: insect
    transmitter: acetylcholine
    family: pLGIC-cation
    note: 'PREPARATION-RESOLVED KEY (added in v0.6.1): the native nicotinic receptor population of Drosophila melanogaster head membranes - the preparation in which the high-affinity [3H]imidacloprid site was measured directly in the modelled organism. It is NOT a subunit: the preparation resolves no Dalpha/Dbeta subunit (the companion photoaffinity study labels a single 66 kDa ligand-binding polypeptide and does not assign it to a named subunit), so nothing here licenses a subunit claim. It carries no gain rule - flylab/pharm/mechanisms.py patches the aggregate insect_nAChR key, and this key exists so that a Drosophila-measured binding constant is not silently attached to a receptor it did not measure. Note the circularity a reader should weigh: the key is defined by the preparation, which is what makes its relation exact_compound_exact_receptor_exact_species.'
  insect_RDL:
    organism: insect
    transmitter: gaba
    family: pLGIC-anion
    note: Resistance-to-dieldrin GABA-gated chloride channel.
  insect_GluCl:
    organism: insect
    transmitter: glutamate
    family: pLGIC-anion
    note: Glutamate-gated chloride channel, avermectin target.
  insect_AChE:
    organism: insect
    transmitter: acetylcholine
    family: enzyme
    note: Ace / acetylcholinesterase; inhibition raises synaptic ACh tone.
  insect_Nav:
    organism: insect
    transmitter: null
    family: channel
    note: para voltage-gated sodium channel, pyrethroid/DDT target.
  insect_OctR:
    organism: insect
    transmitter: octopamine
    family: GPCR
    note: Octopamine receptors (OAMB / Octbeta), formamidine target.
  vertebrate_nAChR_a4b2:
    organism: vertebrate
    transmitter: acetylcholine
    family: pLGIC-cation
    note: High-affinity neuronal nicotinic receptor.
  vertebrate_nAChR_a7:
    organism: vertebrate
    transmitter: acetylcholine
    family: pLGIC-cation
    note: Homomeric alpha7 nicotinic receptor.
  vertebrate_GABA_A:
    organism: vertebrate
    transmitter: gaba
    family: pLGIC-anion
    note: Mammalian GABA-A receptor (e.g. alpha1beta2gamma2).
  vertebrate_GlyR:
    organism: vertebrate
    transmitter: glycine
    family: pLGIC-anion
    note: Mammalian glycine receptor.
  vertebrate_AChE:
    organism: vertebrate
    transmitter: acetylcholine
    family: enzyme
    note: Mammalian acetylcholinesterase.
  vertebrate_Nav1_x:
    organism: vertebrate
    transmitter: null
    family: channel
    note: Mammalian voltage-gated sodium channels (Nav1.2 / Nav1.6).
selectivity_pairs:
  nAChR:
    insect: insect_nAChR
    vertebrate: vertebrate_nAChR_a4b2
  GABA_A:
    insect: insect_RDL
    vertebrate: vertebrate_GABA_A
  GluCl:
    insect: insect_GluCl
    vertebrate: vertebrate_GlyR
  AChE:
    insect: insect_AChE
    vertebrate: vertebrate_AChE
  Nav:
    insect: insect_Nav
    vertebrate: vertebrate_Nav1_x
compounds:
  imidacloprid:
    name: Imidacloprid
    class: neonicotinoid
    cas: 138261-41-3
    receptors:
      insect_nAChR:
        param_type: EC50
        value_M: 2.0e-08
        n: 1.2
        direction: agonist
        efficacy: 1.0
        relation: exact_compound_related_receptor
        species: Ctenocephalides felis alpha1/alpha2 + Gallus gallus beta2 hybrid
        source: 'Dederer et al. 2011, Insect Biochem Mol Biol 41:51 (Drosophila/Ctenocephalides alpha1-beta1 nAChR; neonicotinoid agonist potency in the 10-100 nM order). Value kept unchanged from FlyLab v0.4. SOURCE DESCRIPTION CORRECTED in v0.6 (schema v3): Dederer et al. expressed cat-flea Cfalpha1/Cfalpha2 with the CHICKEN beta2 subunit, i.e. a hybrid receptor - not an ''alpha1-beta1'' receptor as the v0.5 source string said. The value is unchanged; only the description of what was measured is corrected. It is an agonist EC50 on a hybrid receptor, so this row is typed EC50 / exact_compound_related_receptor (evidence distance E2) and drives functional_engagement_proxy, never binding occupancy. The subunit-resolved beta1 row is insect_nAChR_beta1.'
        evidence_tier: literature_order
      vertebrate_nAChR_a4b2:
        param_type: EC50
        value_M: 1.0e-05
        n: 1.0
        direction: agonist
        efficacy: 0.3
        relation: class_extrapolation
        species: mammalian (review-level contrast)
        source: Tomizawa and Casida 2005, Annu Rev Pharmacol Toxicol 45:247 (imidacloprid selectivity for insect over vertebrate nAChR is >1000-fold; vertebrate potency in the micromolar order). Order-of-magnitude selectivity contrast, kept from FlyLab v0.4.
        evidence_tier: literature_order
      vertebrate_GABA_A:
        param_type: unknown
        value_M: null
        n: 1.0
        direction: none
        efficacy: 0.0
        relation: unsupported
        source: 'class-order placeholder: no neonicotinoid action at GABA-A assumed'
        evidence_tier: class_placeholder
      insect_RDL:
        param_type: unknown
        value_M: null
        n: 1.0
        direction: none
        efficacy: 0.0
        relation: unsupported
        source: 'class-order placeholder: no neonicotinoid action at RDL assumed'
        evidence_tier: class_placeholder
      insect_nAChR_native_dmel:
        param_type: Kd
        value_M: 2.0e-09
        n: 1.0
        direction: agonist
        efficacy: 1.0
        relation: exact_compound_exact_receptor_exact_species
        species: Drosophila melanogaster (native head membranes; nAChR population not resolved to subunits)
        source: 'Tomizawa, Latli and Casida 1996, J Neurochem 67(4):1669-1676, doi:10.1046/j.1471-4159.1996.67041669.x, PMID 8858952 ("Head membranes of Drosophila melanogaster and Musca domestica have a single high-affinity binding site for [3H]IMI with KD values of 1-2 nM and Bmax values of 560-850 fmol/mg of protein"). This is a radioligand saturation Kd measured on the MODELLED organism, which is why it is the library''s only binding_occupancy row. Two honest limits are recorded rather than smoothed over: (a) the publication states the 1-2 nM range for Drosophila and Musca jointly and does not resolve the Drosophila-only value, so FlyLab takes the conservative (weakest-affinity) end, 2.0e-9 M, and the tier stays literature_order; (b) the preparation is native head membranes and resolves NO subunit - the companion photoaffinity study (Tomizawa and Casida 1997, Neurosci Lett 237:61, PMID 9453215, doi:10.1016/s0304-3940(97)00811-2) labels a single 66 kDa ligand-binding polypeptide of the Drosophila nAChR without assigning it to a named Dalpha/Dbeta subunit - so the row sits on the preparation-resolved key insect_nAChR_native_dmel and makes no subunit claim. It does not replace the Dederer hybrid-receptor EC50 on the aggregate insect_nAChR key, which is a functional potency and stays where it was.'
        evidence_tier: literature_order
      insect_nAChR_beta1:
        param_type: Kd
        value_M: 8.3e-11
        n: 1.0
        direction: agonist
        efficacy: 1.0
        relation: exact_compound_exact_receptor_other_species
        species: Myzus persicae (native beta1-containing nAChR, susceptible clone 4106A)
        source: 'Bass et al. 2011, BMC Neuroscience 12:51, doi:10.1186/1471-2202-12-51 ([3H]-imidacloprid saturation binding on whole-body membranes: the susceptible 4106A clone has two sites, Kd 0.083 +/- 0.0085 nM (Bmax 100 fmol/mg) and Kd 1.7 +/- 0.65 nM (Bmax 298 fmol/mg); the R81T mutation in the nAChR beta1 subunit abolishes the high-affinity site, leaving a single Kd 4.14 +/- 0.39 nM site in the resistant FRC clone). FlyLab uses the high-affinity Kd = 8.3e-11 M. This is a genuine equilibrium dissociation constant from a radioligand binding assay, but it was measured in an APHID, not in Drosophila. Under the v0.6.1 rule a binding constant licenses physical binding_occupancy only with relation exact_compound_exact_receptor_exact_species, so this row sits at evidence distance E1 and drives binding_engagement_proxy: the same Hill number, reported as an engagement proxy derived from a binding constant measured in another species, and carrying a provenance warning that names the gap. The transfer of an aphid beta1 affinity to the Drosophila Dbeta1 receptor is an assumption, not a measurement.'
        evidence_tier: literature_order
