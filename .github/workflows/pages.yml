name: pages

# Build the static bench (Pyodide + the flylab wheel) and publish it to
# GitHub Pages.  Deliberately NOT run on pull_request: a PR must never be able
# to publish to the live site, and the build is checked by `tests.yml` anyway
# (tests/test_build_pages.py).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Build the static site
        # fails the job if dist/pages goes over the 25 MB budget
        run: python scripts/build_pages.py --out dist/pages

      - name: Show the manifest
        run: cat dist/pages/manifest.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
