[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flylab"
version = "0.6.0"
description = "Virtual pharmacology lab on the Drosophila MaleCNS connectome"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FlyLab contributors" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pandas>=2.1",
  "pyarrow>=15.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
viz = ["matplotlib>=3.8"]
browser-test = ["playwright>=1.48"]
# The science core only needs these two. This is what the static (Pyodide)
# build installs; fastapi/pydantic/typer/pandas/pyarrow are server and CLI
# dependencies and are never loaded in the browser -- see docs/PAGES.md.
browser = ["numpy>=1.26", "pyyaml>=6.0"]
[project.scripts]
flylab = "flylab.cli:app"
[tool.setuptools.packages.find]
include = ["flylab*"]
[tool.setuptools.package-data]
flylab = ["pharm/*.yaml", "static/*"]

[tool.pytest.ini_options]
# `pytest -q` stays the fast contract suite; the end-to-end static build
# (pip wheel + Pyodide) is opt-in with `pytest -m slow`.
addopts = "-m 'not slow'"
markers = [
  "slow: minutes-long end-to-end checks (static site build, browser boot)",
]
